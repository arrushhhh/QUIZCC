<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climb to the Cloud — AWS Modules 1–6 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#cfe8f7; --sky-bot:#fff6e3; --ink:#15294a; --ink-soft:#4a5d7e;
  --paper:#ffffff; --sun:#ffb627; --leaf:#2f9e6e; --flare:#e0503a;
  --line:#c9d8e8; --balloon:#ff6b4a; --band:rgba(21,41,74,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0d1b33; --sky-bot:#23264a; --ink:#eef3fb; --ink-soft:#a9b7cf;
    --paper:#1a2744; --sun:#ffc24d; --leaf:#4cc28e; --flare:#ff7a63;
    --line:#2f4066; --balloon:#ff7d5c; --band:rgba(255,255,255,.05);
  }
}
:root[data-theme="dark"]{
  --sky-top:#0d1b33; --sky-bot:#23264a; --ink:#eef3fb; --ink-soft:#a9b7cf;
  --paper:#1a2744; --sun:#ffc24d; --leaf:#4cc28e; --flare:#ff7a63;
  --line:#2f4066; --balloon:#ff7d5c; --band:rgba(255,255,255,.05);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top),var(--sky-bot)) fixed;
  background-color:var(--sky-top);
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px;line-height:1.5;
}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}

.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 48px;display:grid;grid-template-columns:150px 1fr;gap:32px;align-items:start}
@media (max-width:720px){.wrap{grid-template-columns:1fr;gap:16px;padding:16px 14px 40px}}

/* Altimeter */
.alti{position:sticky;top:calc(24px + env(safe-area-inset-top,0px));height:min(78vh,620px);display:flex;gap:10px}
.scale{position:relative;flex:1;border-left:2px solid var(--line)}
.band{position:absolute;left:0;right:0;padding-left:12px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;border-top:1px dashed var(--line)}
.band:nth-child(odd){background:var(--band)}
.band b{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;color:var(--ink)}
.balloon{position:absolute;left:-17px;width:32px;transition:bottom .9s cubic-bezier(.34,1.4,.5,1)}
.balloon svg{display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
@media (max-width:720px){
  .alti{position:relative;top:0;height:auto;flex-direction:column}
  .scale{border-left:none;border-bottom:2px solid var(--line);height:56px;display:flex}
  .band{position:relative !important;bottom:auto !important;height:100% !important;flex:1;padding:0 4px;justify-content:center;border-top:none;border-left:1px dashed var(--line);font-size:11px;text-align:center}
  .band span{display:none}
  .balloon{left:0;bottom:auto !important;top:-6px;transition:left .9s cubic-bezier(.34,1.4,.5,1)}
  .balloon svg{width:26px}
}

/* Main */
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);line-height:.95;margin:8px 0 14px;font-weight:800;letter-spacing:-.02em}
.hero p{max-width:56ch;color:var(--ink-soft);margin:0 0 22px}
.mods{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.mod{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-size:15px}
.mod[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.go{background:var(--balloon);color:#fff;border:none;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.go:disabled{opacity:.4;cursor:not-allowed}
.best{margin-top:16px;font-size:15px;color:var(--ink-soft)}

.card{background:var(--paper);border-radius:22px;padding:28px clamp(18px,4vw,36px);box-shadow:0 18px 40px -20px rgba(21,41,74,.45);position:relative}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-soft);margin-bottom:12px;flex-wrap:wrap}
.tag{background:var(--band);padding:2px 10px;border-radius:999px}
.q{font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.25;margin:0 0 20px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:transparent;border:2px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16.5px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--band);font-weight:700;font-size:14px}
.opt.right{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,transparent)}
.opt.right .k{background:var(--leaf);color:#fff}
.opt.wrong{border-color:var(--flare);background:color-mix(in srgb,var(--flare) 12%,transparent)}
.opt.wrong .k{background:var(--flare);color:#fff}
.opt:disabled{cursor:default}
.hintbtn{background:none;border:none;color:var(--ink-soft);text-decoration:underline;padding:0;margin-top:14px;font-size:15px}
.hint{margin-top:10px;color:var(--ink-soft);font-style:italic}
.fb{margin-top:18px;padding:14px 16px;border-radius:14px;background:var(--band)}
.fb strong{font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem;display:block;margin-bottom:2px}
.fb.ok strong{color:var(--leaf)} .fb.no strong{color:var(--flare)}
.row{display:flex;justify-content:flex-end;margin-top:18px}
.next{background:var(--ink);color:var(--paper);border:none;border-radius:12px;padding:12px 22px;font-weight:700}
.streak{position:absolute;top:-14px;right:22px;background:var(--sun);color:#15294a;font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px;transform:rotate(3deg)}

.result h2{font-size:clamp(2rem,5vw,3.4rem);margin:4px 0 6px;line-height:1}
.result .big{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(3.5rem,10vw,6rem);font-weight:800;line-height:1;margin:10px 0}
.permod{display:grid;gap:8px;margin:20px 0}
.pm{display:grid;grid-template-columns:minmax(120px,190px) 1fr 48px;gap:10px;align-items:center;font-size:15px}
.pm .bar{height:12px;border-radius:6px;background:var(--band);overflow:hidden}
.pm .bar i{display:block;height:100%;background:var(--leaf)}
.miss{margin-top:22px}
.miss h3{margin:0 0 10px}
.miss details{border-top:1px solid var(--line);padding:10px 0}
.miss summary{cursor:pointer;font-weight:700}
.miss p{margin:6px 0 0;color:var(--ink-soft)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.ghost{background:transparent;border:2px solid var(--ink);border-radius:12px;padding:10px 18px;font-weight:700}
.hidden{display:none !important}
.kbd{font-size:13px;color:var(--ink-soft);margin-top:14px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media (max-width:720px){.kbd{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="alti" aria-label="Altitude progress">
    <div class="scale" id="scale"></div>
  </aside>

  <main>
    <section id="start" class="hero">
      <h1>Climb to the cloud</h1>
      <p>Every correct answer lifts your balloon one step higher, from the server room up through the AZs, Regions and edge into the cloud. Wrong answers let a little air out. 22 questions from AWS Cloud Foundations modules 1–6.</p>
      <div class="mods" id="mods" role="group" aria-label="Choose modules"></div>
      <button class="go" id="goBtn">Take off</button>
      <div class="best" id="best"></div>
    </section>

    <section id="quiz" class="card hidden" aria-live="polite">
      <div class="streak hidden" id="streak"></div>
      <div class="meta"><span id="qnum"></span><span class="tag" id="qmod"></span></div>
      <h2 class="q" id="qtext"></h2>
      <div class="opts" id="opts"></div>
      <button class="hintbtn" id="hintBtn">Show a hint</button>
      <div class="hint hidden" id="hint"></div>
      <div class="fb hidden" id="fb"><strong id="fbHead"></strong><span id="fbText"></span></div>
      <div class="row"><button class="next hidden" id="nextBtn">Next question</button></div>
      <div class="kbd">Keys: 1–4 to answer, Enter for next.</div>
    </section>

    <section id="result" class="card result hidden">
      <h2 id="rTitle"></h2>
      <div class="big" id="rScore"></div>
      <div id="rLine"></div>
      <div class="permod" id="permod"></div>
      <div class="miss" id="miss"></div>
      <div class="actions">
        <button class="go" id="againBtn">Fly again</button>
        <button class="ghost" id="missBtn">Retry only the misses</button>
        <button class="ghost" id="homeBtn">Change modules</button>
      </div>
    </section>
  </main>
</div>

<script>
const MODS = {
  1:"Cloud concepts", 2:"Economics & billing", 3:"Global infrastructure",
  4:"Security", 5:"Networking", 6:"Compute"
};
const Q = [
 {m:1,q:"Which is one of the six advantages of cloud computing?",o:["Trade variable expense for capital expense","Trade capital expense for variable expense","Guess capacity in advance","Increase spending on data centers"],a:1,h:"Think CapEx vs. pay-as-you-go.",e:"You stop buying servers up front (CapEx) and pay only for what you use (variable expense)."},
 {m:1,q:"AWS Elastic Beanstalk is an example of which service model?",o:["IaaS","PaaS","SaaS","On-premises"],a:1,h:"You upload code; who runs the OS?",e:"Beanstalk manages the platform (OS, runtime, servers); you supply only code. EC2 is IaaS."},
 {m:2,q:"Which are the three fundamental drivers of cost in AWS?",o:["Compute, storage, inbound data transfer","Compute, storage, outbound data transfer","IAM users, Regions, storage","Compute, VPCs, support plan"],a:1,h:"Data coming in is usually free.",e:"Outbound data transfer is charged; inbound is generally free."},
 {m:2,q:"Which tool sends an alert when your costs exceed a threshold you set?",o:["AWS Cost Explorer","AWS Pricing Calculator","AWS Budgets","AWS Artifact"],a:2,h:"You set a limit and get notified.",e:"Budgets = custom limits + alerts. Cost Explorer analyzes and forecasts; Pricing Calculator estimates before you build."},
 {m:2,q:"What does a service control policy (SCP) in AWS Organizations do?",o:["Grants permissions to IAM users","Sets the maximum permissions for accounts in an OU","Combines bills across accounts","Encrypts data in member accounts"],a:1,h:"It's a ceiling, not a key.",e:"SCPs only limit what accounts can do; they never grant permissions by themselves."},
 {m:2,q:"Which support plan includes a Technical Account Manager (TAM)?",o:["Basic","Developer","Business","Enterprise"],a:3,h:"The top tier.",e:"Only Enterprise includes a TAM and under-15-minute response for business-critical outages."},
 {m:3,q:"An Availability Zone is best described as…",o:["A geographic area containing multiple Regions","One or more isolated data centers within a Region","A site that caches content for CloudFront","A single server rack"],a:1,h:"Region → ? → data center",e:"Region → AZs → data centers. Edge locations are separate and used by CloudFront and Route 53."},
 {m:3,q:"Which is NOT one of the factors for selecting an AWS Region?",o:["Data governance and legal requirements","Proximity to customers","Number of IAM users in the account","Cost"],a:2,h:"One of these is a global service detail.",e:"The four factors: data governance, latency/proximity, services available, cost. IAM is global."},
 {m:4,q:"Under the shared responsibility model, who patches the guest OS on an EC2 instance?",o:["AWS","The customer","Both equally","The AMI vendor"],a:1,h:"EC2 is IaaS.",e:"EC2 is IaaS, so the guest OS is the customer's job. For RDS or Lambda, AWS patches it."},
 {m:4,q:"A user has Allow s3:* and an explicit Deny on s3:DeleteObject. Can they delete objects?",o:["Yes, Allow is evaluated first","Yes, the broader policy wins","No, an explicit Deny always wins","Only with MFA"],a:2,h:"One word always beats Allow.",e:"IAM evaluation: default deny → explicit Allow → explicit Deny overrides everything."},
 {m:4,q:"What's the best way to give an EC2 application access to an S3 bucket?",o:["Store access keys in the application code","Use the root user's credentials","Attach an IAM role to the instance","Make the bucket public"],a:2,h:"Temporary credentials, nothing stored.",e:"Roles provide temporary credentials with no long-term keys on the instance."},
 {m:4,q:"Where can you download AWS compliance reports such as SOC and ISO?",o:["AWS Config","AWS Artifact","AWS CloudTrail","Amazon Inspector"],a:1,h:"Think of an archaeological find.",e:"Artifact is the compliance-report portal. CloudTrail logs API calls; Config tracks resource configuration."},
 {m:5,q:"How many usable IP addresses does a /24 subnet in a VPC have?",o:["256","254","251","250"],a:2,h:"AWS reserves a few in every subnet.",e:"2⁸ = 256, minus the 5 addresses AWS reserves = 251."},
 {m:5,q:"Which statement about security groups is true?",o:["They are stateless and support Deny rules","They are stateful and support Allow rules only","They operate at the subnet level","Rules are evaluated in number order"],a:1,h:"The other three describe a network ACL.",e:"Security groups: instance level, stateful, Allow only. NACLs: subnet level, stateless, Allow and Deny, numbered order."},
 {m:5,q:"Private-subnet instances need updates from the internet without accepting inbound connections. What do you use?",o:["Internet gateway attached to the private subnet","NAT gateway in a public subnet","VPC peering","Elastic IP on each instance"],a:1,h:"Outbound only.",e:"A NAT gateway in a public subnet lets private instances reach out while blocking unsolicited inbound traffic."},
 {m:5,q:"VPC A is peered with B, and B with C. Can A talk to C through B?",o:["Yes, automatically","Yes, if CIDRs don't overlap","No, peering is not transitive","Only via Route 53"],a:2,h:"Friends of friends aren't friends here.",e:"You need a direct A↔C peering or a Transit Gateway."},
 {m:5,q:"Which Route 53 routing policy sends users to the Region with the lowest network delay?",o:["Weighted","Geolocation","Latency-based","Failover"],a:2,h:"It's in the name.",e:"Latency-based picks the lowest-latency Region. Geolocation routes by user location, not measured delay."},
 {m:6,q:"Which EC2 pricing option gives the biggest discount for interruptible batch jobs?",o:["On-Demand","Reserved Instances","Spot Instances","Dedicated Hosts"],a:2,h:"AWS can take it back with 2 minutes' notice.",e:"Spot is up to ~90% off, but instances can be reclaimed with a 2-minute warning."},
 {m:6,q:"Which instance family fits an in-memory database best?",o:["Compute optimized (c)","Memory optimized (r)","Storage optimized (i)","Accelerated computing (p)"],a:1,h:"In-memory → ?",e:"Memory optimized instances have large RAM for in-memory workloads and big data analytics."},
 {m:6,q:"What is the maximum execution time for an AWS Lambda function?",o:["5 minutes","15 minutes","1 hour","Unlimited"],a:1,h:"A quarter of an hour.",e:"Lambda's timeout cap is 15 minutes. Longer jobs belong on EC2, ECS or Fargate."},
 {m:6,q:"Which service runs containers without you managing the underlying servers?",o:["Amazon EC2","AWS Fargate","Amazon ECR","AWS Elastic Beanstalk"],a:1,h:"Serverless + containers.",e:"Fargate is the serverless compute engine for ECS and EKS. ECR only stores images."},
 {m:6,q:"Where do you put a script that installs a web server when an EC2 instance first launches?",o:["Instance metadata","User data","Tags","Key pair"],a:1,h:"Data you, the user, pass in.",e:"User data scripts run at first boot. Metadata is information about the instance at 169.254.169.254."}
];

const LEVELS = [
  ["Server room","on-premises"],["Data center",""],["Availability Zone",""],
  ["Region",""],["Edge location",""],["The cloud","☁"]
];

const $ = id => document.getElementById(id);
let selected = new Set([1,2,3,4,5,6]);
let deck = [], idx = 0, score = 0, streak = 0, alt = 0, misses = [], answered = false;

function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}

function buildScale(){
  const s = $("scale"); const n = LEVELS.length;
  s.innerHTML = LEVELS.map((l,i)=>`<div class="band" style="bottom:${i*100/n}%;height:${100/n}%"><b>${l[0]}</b>${l[1]&&l[1]!=="☁"?`&nbsp;<span>${l[1]}</span>`:""}</div>`).join("") +
   `<div class="balloon" id="balloon" style="bottom:0%"><svg width="32" viewBox="0 0 32 46" aria-hidden="true">
     <path d="M16 2C8 2 3 8 3 15c0 8 8 14 11 18h4c3-4 11-10 11-18C29 8 24 2 16 2z" fill="var(--balloon)"/>
     <path d="M16 2c-3 0-6 6-6 13s4 14 5 18h2c1-4 5-11 5-18S19 2 16 2z" fill="#fff" opacity=".28"/>
     <path d="M14 33l-2 5M18 33l2 5" stroke="var(--ink)" stroke-width="1.2"/>
     <rect x="11" y="38" width="10" height="7" rx="2" fill="#8a5a2b"/></svg></div>`;
}
function setAlt(){
  const b = $("balloon"); if(!b) return;
  const pct = deck.length ? Math.max(0, Math.min(1, alt/deck.length)) : 0;
  if (window.matchMedia("(max-width:720px)").matches){ b.style.left = `calc(${pct*92}% )`; }
  else { b.style.bottom = `calc(${pct*100}% - ${pct*46}px)`; b.style.left=""; }
}

function buildMods(){
  $("mods").innerHTML = Object.entries(MODS).map(([k,v])=>
    `<button class="mod" data-m="${k}" aria-pressed="${selected.has(+k)}">M${k} ${v}</button>`).join("");
  $("mods").querySelectorAll(".mod").forEach(b=>b.onclick=()=>{
    const m=+b.dataset.m; selected.has(m)?selected.delete(m):selected.add(m);
    b.setAttribute("aria-pressed",selected.has(m)); updateGo();
  });
  updateGo();
}
function updateGo(){
  const n = Q.filter(q=>selected.has(q.m)).length;
  $("goBtn").disabled = n===0;
  $("goBtn").textContent = n ? `Take off · ${n} questions` : "Pick at least one module";
}
function showBest(){ const b = store("aws-quiz-best"); $("best").textContent = b ? `Your best so far: ${b}` : ""; }

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function start(list){
  deck = shuffle(list).map(q=>{ const order = shuffle([0,1,2,3]); return {...q, o:order.map(i=>q.o[i]), a:order.indexOf(q.a)}; });
  idx=0; score=0; streak=0; alt=0; misses=[];
  $("start").classList.add("hidden"); $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  setAlt(); render();
}

function render(){
  const q = deck[idx]; answered=false;
  $("qnum").textContent = `Question ${idx+1} of ${deck.length}`;
  $("qmod").textContent = `Module ${q.m}: ${MODS[q.m]}`;
  $("qtext").textContent = q.q;
  $("opts").innerHTML = q.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span>${t}</span></button>`).join("");
  $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $("hint").textContent = q.h; $("hint").classList.add("hidden"); $("hintBtn").classList.remove("hidden");
  $("fb").classList.add("hidden"); $("nextBtn").classList.add("hidden");
  $("opts").querySelector(".opt").focus({preventScroll:true});
}

function pick(i){
  if(answered) return; answered=true;
  const q = deck[idx], btns = $("opts").querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[q.a].classList.add("right");
  const ok = i===q.a;
  if(ok){ score++; streak++; alt++; }
  else { btns[i].classList.add("wrong"); streak=0; alt=Math.max(0,alt-0.5); misses.push(Q.find(x=>x.q===q.q)); }
  setAlt();
  const st = $("streak");
  if(streak>=3){ st.textContent = `${streak} in a row`; st.classList.remove("hidden"); } else st.classList.add("hidden");
  const fb=$("fb"); fb.className = "fb " + (ok?"ok":"no");
  $("fbHead").textContent = ok ? ["Updraft!","Climbing.","Clear skies.","Nailed it."][score%4] : "Lost some altitude.";
  $("fbText").textContent = q.e;
  $("hintBtn").classList.add("hidden");
  $("nextBtn").textContent = idx===deck.length-1 ? "See where you landed" : "Next question";
  $("nextBtn").classList.remove("hidden"); $("nextBtn").focus({preventScroll:true});
}

function next(){ idx++; idx<deck.length ? render() : finish(); }

function finish(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const pct = Math.round(score/deck.length*100);
  const lvl = LEVELS[Math.min(LEVELS.length-1, Math.floor(pct/100*(LEVELS.length-1)+0.0001))][0];
  $("rTitle").textContent = pct>=90 ? "You made it to the cloud" : pct>=70 ? "Cruising altitude" : pct>=50 ? "Halfway up" : "Still on the runway";
  $("rScore").textContent = `${score}/${deck.length}`;
  $("rLine").textContent = `${pct}% · you reached: ${lvl}`;
  const prev = store("aws-quiz-best");
  const prevPct = prev ? parseInt(prev.split("(")[1]) : -1;
  if(pct>prevPct) store("aws-quiz-best", `${score}/${deck.length} (${pct}%)`);
  const mods = [...new Set(deck.map(q=>q.m))].sort();
  $("permod").innerHTML = mods.map(m=>{
    const tot = deck.filter(q=>q.m===m).length, miss = misses.filter(q=>q.m===m).length, r = tot-miss;
    return `<div class="pm"><span>M${m} ${MODS[m]}</span><span class="bar"><i style="width:${r/tot*100}%"></i></span><span>${r}/${tot}</span></div>`;
  }).join("");
  $("miss").innerHTML = misses.length ? `<h3>Review these before the exam</h3>` + misses.map(q=>
    `<details><summary>${q.q}</summary><p><b>${q.o[q.a]}</b> — ${q.e}</p></details>`).join("") : `<h3>No misses. Go get some sleep.</h3>`;
  $("missBtn").classList.toggle("hidden", !misses.length);
  alt = deck.length*pct/100; setAlt();
}

$("goBtn").onclick = ()=>start(Q.filter(q=>selected.has(q.m)));
$("hintBtn").onclick = ()=>{ $("hint").classList.remove("hidden"); $("hintBtn").classList.add("hidden"); };
$("nextBtn").onclick = next;
$("againBtn").onclick = ()=>start(Q.filter(q=>selected.has(q.m)));
$("missBtn").onclick = ()=>start(misses.slice());
$("homeBtn").onclick = ()=>{ $("result").classList.add("hidden"); $("start").classList.remove("hidden"); alt=0; deck=[]; setAlt(); showBest(); };
document.addEventListener("keydown", e=>{
  if($("quiz").classList.contains("hidden")) return;
  if(!answered && /^[1-4]$/.test(e.key)) pick(+e.key-1);
  else if(answered && e.key==="Enter" && document.activeElement!==$("nextBtn")) next();
});
window.addEventListener("resize", setAlt);

buildScale(); buildMods(); showBest(); setAlt();
</script>
</body>
</html>
